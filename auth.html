<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود و ثبت‌نام | تندیس فرشتگان</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="panel.css"></head>
<body class="panel-body"><div class="panel-top"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>تندیس فرشتگان<small>TANDIS FERESHTEGAN</small></span></a><a href="index.html" class="back-link">بازگشت به فروشگاه ←</a></div>
<main class="auth-wrap"><section class="auth-card"><div class="panel-emblem">✦</div><span class="panel-kicker">TANDIS FERESHTEGAN</span><h1>به جمع ما خوش آمدید</h1><p class="panel-intro">برای ورود یا ساخت حساب کاربری، نوع حساب را انتخاب کنید.</p>
<div class="role-switch"><button class="role-btn active" data-role="customer">حساب مشتری</button><button class="role-btn" data-role="admin">ورود مدیر</button></div>
<div class="auth-tabs"><button class="tab-btn active" data-tab="login">ورود</button><button class="tab-btn" data-tab="register">ثبت‌نام</button></div>
<form id="loginForm" class="auth-form"><label>نام کاربری</label><input id="loginUsername" autocomplete="username" required placeholder="نام کاربری خود را وارد کنید"><label>رمز عبور</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="رمز عبور"><button class="panel-primary" type="submit">ورود به حساب</button></form>
<form id="registerForm" class="auth-form hidden"><label>نام و نام خانوادگی</label><input id="registerName" required placeholder="نام شما"><label>نام کاربری</label><input id="registerUsername" required minlength="3" placeholder="حداقل ۳ حرف"><label>رمز عبور</label><input id="registerPassword" type="password" required minlength="6" placeholder="حداقل ۶ کاراکتر"><label>تکرار رمز عبور</label><input id="registerConfirm" type="password" required minlength="6" placeholder="رمز عبور را دوباره وارد کنید"><button class="panel-primary" type="submit">ساخت حساب کاربری</button></form>
<p id="authMessage" class="form-message" aria-live="polite"></p><div class="security-note" id="adminHint">ورود مدیر مخصوص مدیریت محصولات فروشگاه است.</div></section></main>
<script src="store.js"></script><script>
let selectedRole='customer',selectedTab='login';const roleBtns=document.querySelectorAll('.role-btn'),tabBtns=document.querySelectorAll('.tab-btn');
function renderAuth(){document.getElementById('loginForm').classList.toggle('hidden',selectedTab!=='login');document.getElementById('registerForm').classList.toggle('hidden',selectedTab!=='register');tabBtns.forEach(b=>b.classList.toggle('active',b.dataset.tab===selectedTab));roleBtns.forEach(b=>b.classList.toggle('active',b.dataset.role===selectedRole));document.getElementById('adminHint').textContent=selectedRole==='admin'?'حساب مدیر آزمایشی: نام کاربری admin و رمز عبور Tandis1405!':'ثبت‌نام مشتری برای ساخت حساب عادی در همین مرورگر انجام می‌شود.';document.getElementById('authMessage').textContent='';}
roleBtns.forEach(b=>b.addEventListener('click',()=>{selectedRole=b.dataset.role;selectedTab='login';renderAuth()}));tabBtns.forEach(b=>b.addEventListener('click',()=>{selectedTab=b.dataset.tab;renderAuth()}));
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('loginUsername').value.trim(),p=document.getElementById('loginPassword').value;let user=null;if(selectedRole==='admin'){if(u==='admin'&&p==='Tandis1405!')user={username:'admin',name:'مدیر فروشگاه',role:'admin'};}else{user=TandisStore.getUsers().find(x=>x.username.toLowerCase()===u.toLowerCase()&&x.password===p&&x.role==='customer');}if(!user){document.getElementById('authMessage').textContent='نام کاربری یا رمز عبور صحیح نیست.';return;}sessionStorage.setItem('tandisSession',JSON.stringify({username:user.username,name:user.name,role:user.role}));location.href=user.role==='admin'?'admin.html':'account.html';});
document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();if(selectedRole!=='customer'){document.getElementById('authMessage').textContent='ثبت‌نام مدیر از این بخش امکان‌پذیر نیست.';return;}const name=document.getElementById('registerName').value.trim(),username=document.getElementById('registerUsername').value.trim(),password=document.getElementById('registerPassword').value,confirm=document.getElementById('registerConfirm').value;if(password!==confirm){document.getElementById('authMessage').textContent='تکرار رمز عبور مطابقت ندارد.';return;}const users=TandisStore.getUsers();if(users.some(x=>x.username.toLowerCase()===username.toLowerCase())){document.getElementById('authMessage').textContent='این نام کاربری قبلاً ثبت شده است.';return;}users.push({name,username,password,role:'customer'});TandisStore.saveUsers(users);sessionStorage.setItem('tandisSession',JSON.stringify({name,username,role:'customer'}));location.href='account.html';});renderAuth();
</script></body></html>
