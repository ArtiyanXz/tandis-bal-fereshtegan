<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب کاربری | تندیس فرشتگان</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="panel.css"></head><body class="panel-body"><header class="panel-top"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>تندیس فرشتگان<small>TANDIS FERESHTEGAN</small></span></a><a class="back-link" href="shop.html">بازگشت به فروشگاه ←</a></header><main class="auth-wrap"><section class="dashboard-card"><div class="panel-emblem">♡</div><span class="panel-kicker">MY ACCOUNT</span><h1 style="text-align:center">حساب کاربری من</h1><div class="account-summary"><strong id="customerName">کاربر</strong><p id="customerUsername"></p></div><p style="font-size:13px;line-height:2;color:#727c6d">حساب مشتری شما ساخته شده است. در نسخه فعلی، اطلاعات حساب فقط در همین مرورگر نگهداری می‌شود. پس از راه‌اندازی سرور، می‌توانیم سفارش‌ها و اطلاعات واقعی حساب را هم به این بخش اضافه کنیم.</p><div class="dashboard-actions"><a class="soft-btn" href="shop.html">رفتن به فروشگاه</a><button class="danger-btn" id="logoutBtn">خروج از حساب</button></div></section></main><script src="store.js"></script><script>const s=TandisStore.getSession();if(!s||s.role!=='customer')location.replace('auth.html');else{document.getElementById('customerName').textContent=s.name;document.getElementById('customerUsername').textContent='نام کاربری: '+s.username}document.getElementById('logoutBtn').onclick=()=>TandisStore.logout();</script></body></html>
